# ===== SiteStats 统计（粘到每个 nginx server 块顶部、其它 location 之前）=====
location ^~ /api/ss/ {
    proxy_pass http://127.0.0.1:3881;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
location = /ss.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
location = /ss-admin.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
# 可选：保护 web 根下的敏感文件
location ^~ /node_modules/ { return 404; }
location = /package.json { return 404; }
location = /package-lock.json { return 404; }
# ===== SiteStats end =====